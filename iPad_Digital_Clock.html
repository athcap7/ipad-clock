<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock</title>
    <style>
        /* 구형 CSS 호환성 유지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            overflow: hidden;
            color: #ff94c2; /* 기본 핑크 색상 */
        }

        /* 시계 전체 메인 컨테이너 (번인 방지 이동 대상) */
        #clock-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-transition: -webkit-transform 1.5s ease-in-out;
            transition: transform 1.5s ease-in-out;
        }

        /* 상단 영역 */
        .top-row {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: start;
            -webkit-align-items: flex-start;
            align-items: flex-start;
            width: 100%;
            z-index: 10;
        }

        /* 좌상단 설정 아이콘 */
        .settings-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 36px;
            cursor: pointer;
            outline: none;
            opacity: 0.8;
            padding: 10px;
        }
        .settings-btn:active {
            opacity: 1;
        }

        /* 우상단 정보 (배터리 & 날짜) */
        .top-right-info {
            text-align: right;
        }

        .battery-info {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: end;
            -webkit-justify-content: flex-end;
            justify-content: flex-end;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        /* 우상단 정보 (날짜) */
        .top-right-info {
            text-align: right;
        }

        .date-display {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 중앙 시계 영역 */
        .center-row {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
        }

        .time-display {
            font-size: 22vw; /* 반응형 크기 설정 */
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            text-align: center;
        }

        /* 하단 영역 */
        .bottom-row {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: end;
            -webkit-align-items: flex-end;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 10px;
        }

        .day-display {
            font-size: 42px;
            font-weight: 700;
        }

        /* 설정 모달 레이어 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1c1c1e;
            color: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .modal-header {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .setting-item {
            margin-bottom: 18px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        .setting-label {
            font-size: 16px;
        }

        .setting-control input[type="text"],
        .setting-control select {
            background-color: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .color-options {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-dot.active {
            border-color: #ffffff;
        }

        /* 폰트 색상 클래스 */
        .theme-pink { color: #ff94c2; }
        .theme-white { color: #ffffff; }
        .theme-cyan { color: #4cd964; }
        .theme-yellow { color: #ffcc00; }
        .theme-orange { color: #ff9500; }
        .theme-blue { color: #5ac8fa; }
    </style>
</head>
<body class="theme-pink">

    <!-- 시계 메인 래퍼 (번인 방지 이동 대상) -->
    <div id="clock-wrapper">
        <!-- 상단 라인 -->
        <div class="top-row">
            <button class="settings-btn" id="open-settings-btn" aria-label="설정">⚙</button>
            <div class="top-right-info">
                <div class="date-display" id="date-text">2026. 11. 8.</div>
            </div>
        </div>

        <!-- 중앙 시계 -->
        <div class="center-row">
            <div class="time-display" id="time-text">21:37</div>
        </div>

        <!-- 하단 라인 -->
        <div class="bottom-row">
            <div class="day-display" id="day-text">일요일</div>
        </div>
    </div>

    <!-- 설정 모달 패널 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">시계 설정</div>
                <button class="close-btn" id="close-settings-btn">&times;</button>
            </div>
            
            <!-- 시간 표기 방식 -->
            <div class="setting-item">
                <span class="setting-label">시간 형식</span>
                <div class="setting-control">
                    <select id="time-format-select">
                        <option value="24">24 시간제 (21:37)</option>
                        <option value="12">12 시간제 (9:37)</option>
                    </select>
                </div>
            </div>

            <!-- 색상 선택 -->
            <div class="setting-item">
                <span class="setting-label">글자 색상</span>
                <div class="color-options">
                    <div class="color-dot active" style="background-color: #ff94c2;" data-color="theme-pink"></div>
                    <div class="color-dot" style="background-color: #ffffff;" data-color="theme-white"></div>
                    <div class="color-dot" style="background-color: #ffcc00;" data-color="theme-yellow"></div>
                    <div class="color-dot" style="background-color: #ff9500;" data-color="theme-orange"></div>
                    <div class="color-dot" style="background-color: #4cd964;" data-color="theme-cyan"></div>
                    <div class="color-dot" style="background-color: #5ac8fa;" data-color="theme-blue"></div>
                </div>
            </div>

            <!-- 번인 방지 설정 -->
            <div class="setting-item">
                <span class="setting-label">번인 방지 이동</span>
                <div class="setting-control">
                    <select id="burnin-select">
                        <option value="on">사용함 (1분마다 이동)</option>
                        <option value="off">사용 안 함</option>
                    </select>
                </div>
            </div>

            <!-- 전체화면 (지원 시) -->
            <div class="setting-item">
                <span class="setting-label">전체화면</span>
                <div class="setting-control">
                    <button id="fullscreen-btn" style="background:#3a3a3c; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">전체화면 전환</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ES5 스타일 스크립트 (구형 사파리 / iOS 12 완벽 호환) -->
    <script>
        (function() {
            // 요일 명칭 정의
            var DAYS_KOR = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

            // DOM 요소 참조
            var clockWrapper = document.getElementById('clock-wrapper');
            var timeDisplay = document.getElementById('time-text');
            var dateDisplay = document.getElementById('date-text');
            var dayDisplay = document.getElementById('day-text');
            
            // 모달 및 설정 요소
            var settingsModal = document.getElementById('settings-modal');
            var openSettingsBtn = document.getElementById('open-settings-btn');
            var closeSettingsBtn = document.getElementById('close-settings-btn');
            var timeFormatSelect = document.getElementById('time-format-select');
            var burninSelect = document.getElementById('burnin-select');
            var fullscreenBtn = document.getElementById('fullscreen-btn');
            var colorDots = document.querySelectorAll('.color-dot');

            // 상태 변수 (기본값 설정)
            var config = {
                is24Hour: true,
                theme: 'theme-pink',
                burnInProtection: true
            };

            // 숫자 2자리 패딩 함수
            function padZero(num) {
                return (num < 10 ? '0' : '') + num;
            }

            // 시계 및 날짜 업데이트 함수
            function updateClock() {
                var now = new Date();
                
                // 시간 계산
                var hours = now.getHours();
                var minutes = padZero(now.getMinutes());
                
                if (!config.is24Hour) {
                    hours = hours % 12;
                    if (hours === 0) hours = 12;
                } else {
                    hours = padZero(hours);
                }

                timeDisplay.innerText = hours + ':' + minutes;

                // 날짜 계산 (YYYY. M. D.)
                var year = now.getFullYear();
                var month = now.getMonth() + 1;
                var date = now.getDate();
                dateDisplay.innerText = year + '. ' + month + '. ' + date + '.';

                // 요일 계산
                var dayIndex = now.getDay();
                dayDisplay.innerText = DAYS_KOR[dayIndex];
            }

            // 번인 방지 이동 함수 (화면 픽셀 구역 무작위 픽셀 이동)
            function applyBurnInShift() {
                if (!config.burnInProtection) {
                    clockWrapper.style.webkitTransform = 'translate(0px, 0px)';
                    clockWrapper.style.transform = 'translate(0px, 0px)';
                    return;
                }

                // ±15px 범위 내에서 무작위 이동
                var maxShift = 15;
                var randomX = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;
                var randomY = Math.floor(Math.random() * (maxShift * 2 + 1)) - maxShift;

                var transformStr = 'translate(' + randomX + 'px, ' + randomY + 'px)';
                clockWrapper.style.webkitTransform = transformStr;
                clockWrapper.style.transform = transformStr;
            }

            // 이벤트 리스너 바인딩 (iOS 호환)
            function bindEvents() {
                // 설정 창 열기 / 닫기
                openSettingsBtn.addEventListener('click', function() {
                    settingsModal.style.display = 'flex';
                });
                closeSettingsBtn.addEventListener('click', function() {
                    settingsModal.style.display = 'none';
                });

                // 시간 포맷 변경
                timeFormatSelect.addEventListener('change', function(e) {
                    config.is24Hour = (e.target.value === '24');
                    updateClock();
                });

                // 번인 설정 변경
                burninSelect.addEventListener('change', function(e) {
                    config.burnInProtection = (e.target.value === 'on');
                    applyBurnInShift();
                });

                // 색상 테마 변경
                for (var i = 0; i < colorDots.length; i++) {
                    colorDots[i].addEventListener('click', function(e) {
                        var target = e.target;
                        var selectedColor = target.getAttribute('data-color');
                        
                        // Active 클래스 갱신
                        for (var j = 0; j < colorDots.length; j++) {
                            colorDots[j].classList.remove('active');
                        }
                        target.classList.add('active');

                        // Body 클래스 변경
                        document.body.className = selectedColor;
                        config.theme = selectedColor;
                    });
                }

                // 전체화면 토글
                fullscreenBtn.addEventListener('click', function() {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen();
                        } else if (document.documentElement.webkitRequestFullscreen) {
                            document.documentElement.webkitRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                });
            }

            // 초기화
            window.onload = function() {
                updateClock();
                bindEvents();

                // 1초마다 시계 갱신
                setInterval(updateClock, 1000);

                // 1분(60,000ms)마다 번인 방지 미세 위치 이동
                setInterval(applyBurnInShift, 60000);
            };
        })();
    </script>
</body>
</html>
